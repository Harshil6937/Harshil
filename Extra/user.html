<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var s=prompt("Enter Username:");

		var regex=/^[a-zA-Z]{8,12}$/

		if (regex.test(s))
		{
			alert("Valid");
		}
		else{
			alert("Invalid");
		}
	</script>
</body>
</html>
