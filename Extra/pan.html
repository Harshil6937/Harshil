<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var s=prompt("Enter PAN NUMBER:");

		var regex=/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/

		if(regex.test(s))
		{
			document.write("Valid");
		}
		else{
			document.write("Invalid");
		}

	</script>

</body>
</html>
