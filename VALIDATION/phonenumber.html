<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var n=prompt("Enter Phone Number");

		var regex=/^[0-9]{10}$/

		if(regex.test(n))
		{
			alert("VALID");
		}

		else{
			alert("INVALID");
		}

	</script>


</body>
</html>
