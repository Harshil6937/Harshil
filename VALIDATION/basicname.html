<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">

		var name=prompt("Enter Name");

		var regex=/^[a-zA-Z0-9]+$/;

		if(regex.test(name))
		{
			alert("VALID");
		}

		else{
			alert("INVALID");
		}

		
	</script>

</body>
</html>
