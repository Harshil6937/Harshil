<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var email=prompt("Enter Email Address");

		var regex=/^[a-z0-9.#+%_]+@[a-z]+\.[a-z]{2,}$/;

		if(regex.test(email))
		{
			alert("VALID");
		}

		else{
			alert("INVALID");
		}


	</script>

</body>
</html>
