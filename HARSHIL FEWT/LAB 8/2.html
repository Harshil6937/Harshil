<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<h1 id="ans"></h1>

	<script type="text/javascript">
		var n=parseInt(prompt("Enter Number"));
		var count=0;

		for(var i=1;i<=n;i++)
		{
			if (n%i==0)
			{
				count++;
			}
		}

		if(count==2)
		{
			document.getElementById('ans').innerHTML="Number Is Prime";
		}
		else{
			document.getElementById('ans').innerHTML="Number Is Not Prime";
		}

	</script>

</body>
</html>
