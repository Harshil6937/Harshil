<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<table>
		<tr>
			<td colspan="4">
				<input type="text" name="" disabled id="ans">
			</td>
		</tr>
		<tr>
			<td><button onclick="abc(1)">1</button></td>
			<td><button onclick="abc(2)">2</button></td>
			<td><button onclick="abc(3)">3</button></td>
			<td><button onclick="abc(+)">+</button></td>
		</tr>
		<tr>
			<td><button onclick="abc(4)">4</button></td>
			<td><button onclick="abc(5)">5</button></td>
			<td><button onclick="abc(6)">6</button></td>
			<td><button onclick="abc(-)">-</button></td>
		</tr>
		<tr>
			<td><button onclick="abc(7)">7</button></td>
			<td><button onclick="abc(8)">8</button></td>
			<td><button onclick="abc(9)">9</button></td>
			<td><button onclick="abc(*)">*</button></td>
		</tr>
		<tr>
			<td><button onclick="0">0</button></td>
			<td><button onclick="/">/</button></td>
			<td><button onclick="=">=</button></td>
			<td><button onclick="%">%</button></td>
		</tr>
	</table>

	<script type="text/javascript">
		
		function abc (value)
		{
			document.getElementById(ans).value+=value;
		}

	</script>

</body>
</html>
