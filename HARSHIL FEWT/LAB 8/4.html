<body>

	<h1 id="ans"></h1>

	<script type="text/javascript">
		
		var n=parseInt(prompt("Enter N:"));
		var i=0,j=1,k;

		for(var s=0;s<n;s++)
		{
			document.write(i);
			k=i+j;
			j=i;
			i = k;N
		}

	</script>

</body>
