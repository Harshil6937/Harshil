<body>

	<script type="text/javascript">
		
		var a=(prompt("Enter Value1:"));
		var b=(prompt("Enter Value2:"));

		var gcd;

		for(var i=1;i<=a && i<=b ; i++)
		{
			if(a%i==0 && b%i==0)
			{
				gcd=i;
			}
		}	

		console.log(gcd);
		
	</script>
