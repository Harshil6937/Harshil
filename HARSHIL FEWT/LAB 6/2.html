<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var m=parseInt(prompt("Enter Starting-point"));
		var n=parseInt(prompt("Enter Ending-point"));
		var i;
		
		for(i=m;i<=n;i++)
		{
			var count=0;
			for(var j=1;j<=n;j++)
			{
				if(i%j==0)
				{
					count++;
				}
			}
			if(count==2)
			{
				console.log(i);
			}
		}



	</script>


</body>
</html>
