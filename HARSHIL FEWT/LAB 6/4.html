<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>	

	<script type="text/javascript">
		
		var n=prompt("Enter-2 Digit Number");

		var fd=parseInt(n/10);
		var ld=n%10;
		var ans=1;

		for(var i=1;i<=ld;i++)
		{
			ans=ans*fd;
		}

		console.log(ans);

	</script>







</body>
</html>
