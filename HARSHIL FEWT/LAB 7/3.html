<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var n=parseInt(prompt("Enter N:"));
		var i,j,h;

		for(i=1;i<=n;i++)
		{
			for(j=n-1;j>=i;j--)
			{
				document.write("&nbsp;&nbsp;");
			}

			for(h=1;h<=i;h++)
			{
				document.write("*");
			}
			document.write("<br>");
		}

	</script>


</body>
</html>
