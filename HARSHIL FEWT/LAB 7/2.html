<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var n=parseInt(prompt("Enter N"));

		var i,j;
//5
		for(i=n;i>=1;i--)
		{
			for(j=i;j>=1;j--)
			{
				document.write("*");
			}
			document.write("<br>");
		}
	</script>


</body>
</html>
