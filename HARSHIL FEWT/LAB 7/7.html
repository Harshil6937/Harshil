<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

<script>

	var n=parseInt(prompt("Enter N:"));

	var i,j,h;
	var s=1;

	for(i=1;i<=n;i++)
	{ 
		for(j=n-1;j>=i;j--)
		{
			document.write("&nbsp;")
		}
		for(h=1;h<=i;h++)
		{
			
			document.write(s);
		}
		document.write("<br>");
		s++;
	}
	var v=n-1;
	for(var p=n-1;p>=1;p--)
		{
			for( var q=n-1;q>=p;q--)
			{
				document.write("&nbsp;");	
			}
			for(var r=p;r>=1;r--)
			{
				document.write(v);
			}
			document.write("<br>");
			v--;
		}


</script>



</body>
</html>
