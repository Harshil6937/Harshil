<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">
		#d{
			height: 220px;
			width: 220px;
			background-color: red;
			animation-name: abc;
			animation-duration: 7s;
		}
		@keyframes abc{
			from{
				background-color:red;
			}
			to{
				background-color: yellow;
			}
		}
		#a{
			height: 220px;
			width: 220px;
			background-color: yellowgreen;
			position: relative;
			animation-name: b;
			animation-duration: 10s;
			animation-delay: 2s;
			animation-iteration-count: infinite;
			animation-direction: reverse;
			animation-timing-function: ease;
		}

		@keyframes b{
			0%{
				margin-left: 0px;
				margin-top: 0px;
			}
			25%{
				margin-left: 400px;
				margin-top: 0px;
			}
			50%{
				margin-top: 400px;
				margin-left: 400px;
			}
			75%{
				margin-top: 400px;
				margin-left: 0px;
			}
			100%{
				margin-left: 0px;
				margin-top: 0px;
			}
		}

	</style>
</head>
<body>
	<div id="d"></div>
	<br><br><br>
	<div id="a"></div>
</body>
</html>
