<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var s1=prompt("Enter Subject-1 Mark");
		var s2=prompt("Enter Subject-2 Mark");
		var s3=prompt("Enter Subject-3 Mark");
		var s4=prompt("Enter Subject-4 Mark");
		var s5=prompt("Enter Subject-5 Mark");

		var total=s1+s2+s3+s4+s5;
		var per=total/5;

		if(s1>39 && s2>39 && s3>39 && s4>39 && s5>39)
		{
			console.log("Result:PASS")
			if(per>90)
			{
				console.log("Grade A:");
			}

			else if(per>80)
			{
				console.log("Grade B:");
			}
			else if(per>70)
			{
				console.log("Grade C:");
			}
			else if(per>60)
			{
				console.log("Grade D:");
			}
			else if(per>40)
			{
				console.log("Grade E:");
			}
			else if(per<40)
			{
				console.log("F");
			}

		}
		else
		{
				console.log("Fail");
		}

	</script>

</body>
</html>
