<body>

	<script type="text/javascript">
		
		var a=parseInt(prompt("Enter Value A:"));
		var b=parseInt(prompt("Enter Value B"));

		console.log("Before Swap:" +a+" "+b );
		 
		 a=a+b;
		 b=a-b;
		 a=a-b;

		 console.log("After Swap:" +a+" "+b);

	</script>
