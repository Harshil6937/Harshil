<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

<script type="text/javascript">
	
	var a=parseFloat(prompt("Enter No1"));
	var b=parseFloat(prompt("Enter No2"));
	var choice=prompt("Enter Choice");
	var c;

	if(choice=='+')
	{
		c=a+b;
		console.log(c);
	}
	else if(choice=='-')
	{
		c=a-b;
		console.log(c);
	}
	else if(choice=='*')
	{
		c=a*b;
		console.log(c);
	}
	else if(choice=='/')
	{
		c=a/b;
		console.log(c);
	}
	else if (choice=='%') 
	{
		c=a%b;
		console.log(c);
	}
	else{
		console.log("Invalid Operator");
	}
</script>

</body>
</html>
