<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">

		var a=" Harshil Vadgasiya 	"

		document.write("String :" + a + "<br>" + "<br>");

		document.write("CharAt :" + a.charAt(3) + "<br>");

		document.write("charCodeAt:" + a.charCodeAt(1) + "<br>")

		document.write("startsWith:" + a.startsWith("Harshil") + "<br>");

		document.write("endsWith:" + a.endsWith("oggy") + "<br>");

		document.write("includes:" + a.includes("Harshil") + "<br>");

		document.write("indexof:" + a.indexOf("i") + "<br>");

		document.write("lastIndexOf:" + a.lastIndexOf("i") + "<br>");

		document.write("match:" + a.match("svan") + "<br>");

		document.write("repeat:" + a.repeat(3) + "<br>");

		document.write("replace:" + a.replace("Harshil" , "Rohit") + "<br>");

		document.write("search:" + a.search("Rohit") + "<br>");

		document.write("split:" + a.split(" ") + "<br>");

		document.write("substr:" + a.substr(2,7) + "<br>");

		document.write("substring:" + a.substring(2,7) + "<br>");

		document.write("trim:" + a.trim() + "<br>");


	</script>







</body>
</html>
