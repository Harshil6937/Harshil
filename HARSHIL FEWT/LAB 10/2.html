<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<input type="checkbox" name="Apple" value="apple">apple
	<input type="checkbox" name="Apple" value="banana">banana
	<input type="checkbox" name="Apple" value="cherry">cherry
	<br>
	<br>
	<input type="submit" name="Click Me" onclick="ab()">
	
	<h1 id="abc"></h1>
	<script type="text/javascript">


		function ab()
		{
		var a = document.getElementsByName('Apple');

		for(var i=0;i<a.length;i++)
		{
			if(a[i].checked==true)
			{
				document.getElementById('abc').innerHTML+=a[i].value;
			}
		}

		}
	</script>

</body>
</html>
