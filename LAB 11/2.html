<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<h1>Click Button To Change Body Color</h1>
	
	<input type="submit" value="Click Me" onclick="ab()">

	<script type="text/javascript">
		
		function ab()
		{
			document.body.style.backgroundColor="Yellow";
		}

	</script>

</body>
</html>
