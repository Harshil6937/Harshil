<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<button type="submit" onclick="abcd()">Click Me</button>

	<h1 id="abc"></h1>

	<script type="text/javascript">
		
		var count=0;

		function abcd()
		{
			count++;
			document.getElementById('abc').innerHTML=count;
		}

	</script>

</body>
</html>
