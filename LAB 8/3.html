<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<h1 id="ans"></h1>

	<script type="text/javascript">
		
		var n=parseInt(prompt("Enter N:"));
		var ans=1;

		for(var i=1;i<=n;i++)
		{
			ans=ans*i;
		}

		document.getElementById('ans').innerHTML=ans;

	</script>





</body>
</html>
