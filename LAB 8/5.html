<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
		
		var n=parseFloat(prompt("Enter N:"));

		var m;
		var ans=0;
		var temp=n;

		while(n>0)
		{
			m=n%10;
			ans=ans*10+m;
			n=parseInt(n/10);
		}

		if(ans==temp)
		{
			document.write("Number Is Palindrome");
		}
		else
		{
			document.write("Number Is Not  Palindrome");
		}
	</script>

</body>
</html>
