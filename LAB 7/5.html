<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<script type="text/javascript">
	
		var n=parseInt(prompt("Enter N:"));

		var i,j,h;

		for(var i=1;i<=n;i++)
		{
			for( var j=n-1;j>=i;j--)
			{
				document.write("&nbsp;")
			}
			for(var h=1;h<=i;h++)
			{
				document.write("*");
			}
			document.write("<br>");
		}

		for(var p=n-1;p>=1;p--)
		{
			for( var q=n-1;q>=p;q--)
			{
				document.write("&nbsp;");	
			}
			for(var r=p;r>=1;r--)
			{
				document.write("*");
			}
			document.write("<br>");
		}

	</script>





</body>
</html>
